<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>预约日程</title>
	<link rel="stylesheet" type="text/css" href="__STATIC__/ext/layui/css/layui.css" />
	<link rel="stylesheet" type="text/css" href="SHOP_CSS/common.css" />
</head>
<body>
<div class="layui-card ns-card-common" style="margin:20px;">
	<div class="layui-card-header"><span class="ns-card-title">预约日程</span></div>
	<div class="layui-card-body">
		<div class="layui-form">
			<div class="layui-form-item">
				<label class="layui-form-label">日期：</label>
				<div class="layui-input-inline" style="width:180px;">
					<input type="date" id="date" class="layui-input">
				</div>
				<div class="layui-input-inline">
					<button class="layui-btn" id="btn_search">查询</button>
				</div>
			</div>
		</div>
		<table class="layui-table" lay-size="sm">
			<thead>
			<tr>
				<th>时段</th><th>商品</th><th>门店</th><th>数量</th>
				<th>联系人</th><th>电话</th><th>订单号</th><th>状态</th>
			</tr>
			</thead>
			<tbody id="tbody"></tbody>
		</table>
	</div>
</div>
<script src="__STATIC__/js/jquery-3.1.1.js"></script>
<script src="__STATIC__/ext/layui/layui.js"></script>
<script src="SHOP_JS/common.js"></script>
<script>
layui.use(['form'], function(){
	var form = layui.form, layer = layui.layer, $ = layui.jquery;
	var statusMap = {0:'待付款',1:'已预约',2:'已取消',3:'已过期',4:'已完成'};

	function load(){
		var date = $('#date').val() || new Date().toISOString().slice(0,10);
		$.post(ns.url('shop/cashier/schedule'), {date: date}, function(res){
			var list = res.data || [];
			var html = '';
			$.each(list, function(i, item){
				html += '<tr>'
					+ '<td>' + (item.slot_text || item.start_time) + '</td>'
					+ '<td>' + (item.goods_name || '') + '</td>'
					+ '<td>' + (item.store_name || '') + '</td>'
					+ '<td>' + (item.num || 1) + '</td>'
					+ '<td>' + (item.user_name || '') + '</td>'
					+ '<td>' + (item.mobile || '') + '</td>'
					+ '<td>' + (item.order_no || '') + '</td>'
					+ '<td>' + (statusMap[item.status] || item.status) + '</td>'
					+ '</tr>';
			});
			$('#tbody').html(html || '<tr><td colspan="8" style="text-align:center;color:#999;">暂无预约</td></tr>');
		}, 'json');
	}

	$('#btn_search').on('click', load);
	$('#date').val(new Date().toISOString().slice(0,10));
	load();
	form.render();
});
</script>
</body>
</html>
