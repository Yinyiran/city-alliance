<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>门店收银台</title>
	<link rel="stylesheet" type="text/css" href="__STATIC__/ext/layui/css/layui.css" />
	<link rel="stylesheet" type="text/css" href="SHOP_CSS/common.css" />
	<style>
		.ns-cashier-box{max-width:1000px;margin:20px auto;padding:0 15px;}
		.ns-order-info{margin-top:12px;line-height:2;font-size:13px;}
		.ns-qr img{width:220px;height:220px;}
	</style>
</head>
<body>
<div class="ns-cashier-box">
	<div class="layui-card ns-card-common">
		<div class="layui-card-header"><span class="ns-card-title">门店收银台</span></div>
		<div class="layui-card-body">
			<div class="layui-form">
				<div class="layui-form-item">
					<label class="layui-form-label">核销码：</label>
					<div class="layui-input-inline" style="width:320px;">
						<input type="text" id="delivery_code" placeholder="扫描或输入顾客核销码" class="layui-input">
					</div>
					<div class="layui-input-inline">
						<button class="layui-btn" lay-submit lay-filter="find">查单</button>
						<button class="layui-btn layui-btn-primary" lay-submit lay-filter="verify">直接核销</button>
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">收款金额：</label>
					<div class="layui-input-inline" style="width:160px;">
						<input type="number" id="cash_amount" placeholder="默认订单金额" min="0" class="layui-input">
					</div>
					<div class="layui-input-inline">
						<button class="layui-btn" lay-submit lay-filter="cashier">生成收款码</button>
					</div>
				</div>
				<div class="layui-form-item" id="appt_box" style="display:none;">
					<label class="layui-form-label">改约：</label>
					<div class="layui-input-inline" style="width:150px;">
						<input type="date" id="appt_date" class="layui-input">
					</div>
					<div class="layui-input-inline" style="width:150px;">
						<input type="time" id="appt_time" class="layui-input">
					</div>
					<div class="layui-input-inline">
						<button class="layui-btn layui-btn-primary" lay-submit lay-filter="reschedule">提交改约</button>
					</div>
				</div>
			</div>

			<div class="ns-order-info" id="order_info" style="display:none;">
				<div>订单编号：<b class="order_no"></b></div>
				<div>交易类型：<b class="trade_type_name"></b></div>
				<div>状态：<b class="order_status_name"></b>　支付：<b class="pay_text"></b>　核销：<b class="verify_text"></b></div>
				<div>应付金额：<b class="pay_money"></b> 元</div>
				<div id="appt_info" style="display:none;">预约：<b class="appt_text"></b></div>
				<div class="ns-tip" id="tip_info" style="display:none;"></div>
			</div>
			<div class="ns-qr" id="qr_box" style="display:none;">
				<img id="qr_img" alt="收款码">
			</div>
		</div>
	</div>
</div>
<script src="__STATIC__/js/jquery-3.1.1.js"></script>
<script src="__STATIC__/ext/layui/layui.js"></script>
<script src="SHOP_JS/common.js"></script>
<script>
layui.use(['form'], function(){
	var form = layui.form, layer = layui.layer, $ = layui.jquery;
	var current = {};

	function renderOrder(data){
		current = data;
		$('#order_info').show();
		$('.order_no').text(data.order_no);
		$('.trade_type_name').text(data.trade_type_name);
		$('.order_status_name').text(data.order_status_name);
		$('.pay_text').text(Number(data.pay_status) > 0 ? '已支付' : '待支付');
		$('.verify_text').text(Number(data.delivery_status) == 1 ? '已核销' : '未核销');
		$('.pay_money').text(data.pay_money);
		if(data.trade_type == 2 && data.appointment_date){
			$('#appt_info').show();
			$('.appt_text').text(data.appointment_date + ' ' + (data.appointment_slot||'') + ' · ' + (data.delivery_store_name||''));
			$('#appt_box').show();
		}
		if(data.tip){ $('#tip_info').show().text(data.tip); }
	}

	form.on('submit(find)', function(){
		var code = $('#delivery_code').val();
		if(!code) return layer.msg('请输入或扫描核销码', {icon:0});
		$.post(ns.url('shop/cashier/findOrder'), {delivery_code: code}, function(res){
			if(res.code == 0){ renderOrder(res.data); }
			else { layer.msg(res.message, {icon:0}); }
		}, 'json');
		return false;
	});

	form.on('submit(verify)', function(){
		var code = $('#delivery_code').val();
		if(!code) return layer.msg('请输入或扫描核销码', {icon:0});
		layer.confirm('确认核销该订单？', function(index){
			$.post(ns.url('shop/cashier/verify'), {delivery_code: code}, function(res){
				layer.close(index);
				layer.msg(res.message || (res.code==0?'核销成功':'核销失败'), {icon:0});
				if(res.code == 0){ $('#order_info').hide(); }
			}, 'json');
		});
		return false;
	});

	form.on('submit(cashier)', function(){
		if(!current.order_no) return layer.msg('请先查单', {icon:0});
		$.post(ns.url('shop/cashier/cashierCode'), {
			order_no: current.order_no,
			amount: $('#cash_amount').val() || 0
		}, function(res){
			if(res.code == 0){
				var info = res.data.pay_info || {};
				var url = info.code_url || info.qrcode || '';
				if(url){
					$('#qr_img').attr('src', url.indexOf('http') === 0 ? url : url);
					$('#qr_box').show();
				}
				layer.msg('收款码已生成，收款金额 ' + res.data.pay_money + ' 元', {icon:1});
			}else{
				layer.msg(res.message, {icon:0});
			}
		}, 'json');
		return false;
	});

	form.on('submit(reschedule)', function(){
		if(!current.order_id) return layer.msg('请先查单', {icon:0});
		var d = $('#appt_date').val(), t = $('#appt_time').val();
		if(!d || !t) return layer.msg('请选择改约日期与时段', {icon:0});
		$.post(ns.url('shop/cashier/reschedule'), {
			order_id: current.order_id,
			appointment_date: d,
			start_time: t,
			appointment_slot: t
		}, function(res){
			layer.msg(res.message || (res.code==0?'改约成功':'改约失败'), {icon:0});
		}, 'json');
		return false;
	});
});
</script>
</body>
</html>
