<!-- 交易类型配置（商品新增/编辑共用） -->
<div class="layui-card ns-card-common">
	<div class="layui-card-header"><span class="ns-card-title">交易类型</span></div>
	<div class="layui-card-body">
		<div class="layui-form-item">
			<label class="layui-form-label">交易类型：</label>
			<div class="layui-input-block">
				<input type="radio" name="trade_type" value="0" title="普通商品" lay-filter="trade_type" {if $goods_info.trade_type == 0}checked{/if}>
				<input type="radio" name="trade_type" value="1" title="到店消费" lay-filter="trade_type" {if $goods_info.trade_type == 1}checked{/if}>
				<input type="radio" name="trade_type" value="2" title="预约到店" lay-filter="trade_type" {if $goods_info.trade_type == 2}checked{/if}>
				<input type="radio" name="trade_type" value="3" title="到店自提" lay-filter="trade_type" {if $goods_info.trade_type == 3}checked{/if}>
				<input type="radio" name="trade_type" value="4" title="外卖配送" lay-filter="trade_type" {if $goods_info.trade_type == 4}checked{/if}>
			</div>
			<div class="ns-word-aux">到店消费/预约到店/到店自提：顾客到店下单，支持门店扫码收款与到店核销；外卖配送：走同城配送；普通商品：维持原有物流/自提流程。</div>
		</div>
		<div class="layui-form-item js-trade-box" data-trade="1,2" style="display:none">
			<label class="layui-form-label">服务时长：</label>
			<div class="layui-input-inline"><input type="number" name="service_duration" value="{$goods_info.service_duration}" placeholder="如 60" min="0" class="layui-input ns-len-short"></div>
			<div class="layui-form-mid">分钟</div>
			<div class="ns-word-aux">用于生成预约时段长度与预计到店时间，0 表示按预约时段默认时长。</div>
		</div>
		<div class="js-trade-box" data-trade="1" style="display:none">
			<div class="layui-form-item">
				<label class="layui-form-label">自定义金额：</label>
				<div class="layui-input-block">
					<input type="radio" name="allow_custom_amount" value="1" title="允许" lay-filter="allow_custom_amount" {if $goods_info.allow_custom_amount == 1}checked{/if}>
					<input type="radio" name="allow_custom_amount" value="0" title="不允许" lay-filter="allow_custom_amount" {if $goods_info.allow_custom_amount != 1}checked{/if}>
				</div>
				<div class="ns-word-aux">开启后顾客可在下单页自行输入消费金额，仅限到店场景收款。</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">金额范围：</label>
				<div class="layui-input-inline"><input type="number" name="min_order_amount" value="{$goods_info.min_order_amount}" placeholder="起付" min="0" class="layui-input ns-len-short"></div>
				<div class="layui-input-inline"><input type="number" name="max_order_amount" value="{$goods_info.max_order_amount}" placeholder="上限" min="0" class="layui-input ns-len-short"></div>
				<div class="ns-word-aux">单位：元；上限填 0 表示不限制。</div>
			</div>
		</div>
		<div class="js-trade-box" data-trade="2" style="display:none">
			<div class="layui-form-item">
				<label class="layui-form-label">预约规则：</label>
				<div class="layui-input-block">
					<a href="javascript:;" class="layui-btn layui-btn-primary ns-app-add-rule">添加预约规则</a>
					<div class="ns-word-aux">按「门店 + 星期 + 时段」配置可预约时间与同时接待数量，顾客下单时选择时段并占用名额；超时未支付自动释放。</div>
				</div>
			</div>
			<div class="layui-input-block">
				<table class="layui-table ns-appointment-rule-table">
					<thead><tr>
						<th style="width:22%">门店</th>
						<th style="width:32%">可预约星期</th>
						<th style="width:22%">时间段</th>
						<th style="width:8%">间隔(分)</th>
						<th style="width:9%">同时接待</th>
						<th style="width:7%">操作</th>
					</tr></thead>
					<tbody></tbody>
				</table>
			</div>
			<input type="hidden" name="appointment_rules" value="" class="js-appointment-rules">
		</div>
	</div>
</div>
