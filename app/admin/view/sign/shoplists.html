{extend name="base"/}
{block name="resources"}
<style>
	.ns-flex {
		display: flex;
	}

	.layui-form-select {
		width: 120px;
		height: 30px;
	}

	.layui-input-inline span {
		display: inline-block;
		margin-right: 5px;
	}

	.layui-input {
		display: inline-block !important;
	}

	.layui-input-inline {
		width: 100%;
	}

	.layui-input-inline .layui-input {
		width: 100%;
	}
	.layui-form-select {
		width: 220px;
	}
</style>

{/block}
{block name="main"}
<!-- 搜索框 -->
<div class="ns-single-filter-box">
	<div class="layui-form">
		<div class="layui-input-inline layui ns-flex">
			<div class="layui-form-item">
				<div class="layui-inline">
					<label class="layui-form-label">用户名</label>
					<div class="layui-input-inline">
						<input type="text" id="search_username" name="search_username" placeholder="请输入用户名进行搜索"
							autocomplete="off" class="layui-input">
					</div>

				</div>
				<div class="layui-inline">
					<label class="layui-form-label">手机号</label>
					<div class="layui-input-inline">
						<input type="text" id="search_mobile" name="search_mobile" placeholder="请输入手机号进行搜索"
							autocomplete="off" class="layui-input">
					</div>
				</div>
				<div class="layui-inline">
					<label class="layui-form-label">店铺</label>
					<div class="layui-input-inline">
						<select name="shop_id" lay-filter="shop_id">
							<option value="">请选择店铺</option>
							{volist name="$shoplist" id="shop"}
							<option value="{$shop.site_id}">{$shop.site_name}</option>
							{/volist}
						</select>
					</div>
				</div>
				<div class="layui-inline">
					<label class="layui-form-label">签到时间</label>
					<div class="layui-input-inline">
						<input type="text" class="layui-input" name="start_time" id="start_time" autocomplete="off"
							placeholder="开始时间" readonly>
						<i class="ns-calendar"></i>
					</div>
					<div class="layui-form-mid">-</div>
					<div class="layui-input-inline">
						<input type="text" class="layui-input" name="end_time" id="end_time" autocomplete="off"
							placeholder="结束时间" readonly>
						<i class="ns-calendar"></i>
					</div>
				</div>
			</div>
		</div>
		<div class="ns-form-row">
			<button class="layui-btn ns-bg-color" lay-submit lay-filter="search">筛选</button>
			<button type="reset" class="layui-btn layui-btn-primary">重置</button>
		</div>
	</div>
</div>

<table id="record_list" lay-filter="record_list"></table>
<!-- 添加编辑规则弹窗 -->
<script type="text/html" id="record_info">
	<div class="layui-form member-form" id="record_info_list">
		<table id="record_info_list" lay-filter="record_info_list"></table>
	</div>
</script>
<!-- 工具栏操作 -->
<script type="text/html" id="action">
	<div class="ns-table-btn">
		<a class="layui-btn" lay-event="infolist">查看详情</a>
	</div>
</script>
{/block}
{block name="script"}
<script type='text/javascript' src='ADMIN_JS/coupon_list.js'></script>

<script type="text/javascript">
	var table, form, laytpl, laydate,
		repeat_flag = false,
		currentDate = new Date(),
		minDate = "",
		layer_adds,
		layer_edits;

	layui.use(['form', 'laytpl', 'laydate'], function () {
		form = layui.form;
		laytpl = layui.laytpl;
		laydate = layui.laydate;
		currentDate.setDate(currentDate.getDate() - 7);
		form.render();
		
		//渲染时间
		laydate.render({
			elem: '#start_time',
			type: 'date'
		});

		laydate.render({
			elem: '#end_time',
			type: 'date'
		});

		table = new Table({
			elem: '#record_list',
			url: ns.url("admin/sign/shoplists"),
			cols: [
				[
					{
						field: 'nickname',
						title: '用户名',
						width: '10%',
						unresize: 'false',
					},
					{
						field: 'mobile',
						title: '手机号',
						width: '10%',
						unresize: 'false'
					},
					{
						field: 'site_name',
						title: '商铺名称',
						width: '15%',
						unresize: 'false'
					},
					{
						field: 'sign_title',
						title: '第几家',
						width: '8%',
						unresize: 'false',
						templet: function (data) {
							console.log(data);
							return "第" + data.sign_title + "家"
						}
					},
					{
						field: 'rewardtxt',
						title: '签到奖励',
						width: '10%',
						unresize: 'false',
						templet: function (data) {
							console.log(data);
							if(data.rewardtype!=3){
								return data.rewardtxt;
							}else{
								return data.goods_name;
							}
						}
					},
					{
						field: 'sign_time',
						title: '签到时间',
						width: '15%',
						unresize: 'false',
						templet: function (data) {
							if (data.sign_time == 0) {
								return '--';
							} else {
								return ns.time_to_date(data.sign_time)
							}
						}
					}
				]
			]
		});

		/**
		 * 监听工具栏操作
		 */
		table.tool(function (obj) {
			var data = obj.data;
			switch (obj.event) {
				case 'edits': //编辑
					console.log(data);
					editrules(data);
					break;

			}
		});


		form.on('submit(setrules_add)', function (data) {
			console.log(data);
			$.ajax({
				type: "POST",
				url: ns.url("admin/sign/addrules"),
				data: data.field,
				dataType: 'JSON',
				success: function (res) {
					layer.msg(res.message);
					if (res.code == 0) {
						table.reload();
						layer.closeAll('page');
					}
				}
			});
		});
		form.on('submit(setrules_edit)', function (data) {
			console.log(data);
			$.ajax({
				type: "POST",
				url: ns.url("admin/sign/edits"),
				data: data.field,
				dataType: 'JSON',
				success: function (res) {
					layer.msg(res.message);
					if (res.code == 0) {
						table.reload();
						layer.closeAll('page');
					}
				}
			});
		});
		/**
		 * 搜索功能
		 */
		form.on('submit(search)', function (data) {
			table.reload({
				page: {
					curr: 1
				},
				where: data.field
			});
			return false;
		});
	});

	function addrules() {
		layer_adds = layer.open({
			title: '添加签到规则',
			type: 1,
			area: ['450px'],
			content: $('#rules_add').html(),
			success: function () {
				form.render();
			}
		});

	}
	function editrules(data) {
		laytpl($("#rules_edit").html()).render(data, function (html) {
			layer_edits = layer.open({
				title: '编辑签到规则',
				type: 1,
				area: ['450px'],
				content: html,
				success: function () {
					form.render();
					/*$("input[name='rules_id']").val(data.rules_id);
					$("input[name='title']").val(data.title);
					$("input[name='reward_value']").val(data.reward_value);*/
					$("select[name='reward_type']").val(data.reward_type);
					$("select[name='reward_type']").next("div").find("select").val(data.reward_type);

				}
			});
		})

	}
</script>

{/block}
