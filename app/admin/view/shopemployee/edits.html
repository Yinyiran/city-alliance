{extend name="base"/}
{block name="resources"}
<style>
	.ns-form {margin-top: 0;}
</style>
{/block}
{block name="main"}
<div class=" layui-form ns-form">
	<input type="hidden" name="employee_id" value="{$info.employee_id}">
	<input type="hidden" name="site_id" value="{$info.shop_id}">
	<div class="layui-form-item">
		<label class="layui-form-label "><span class="required">*</span>会员ID：</label>
		<div class="layui-input-block">
			<input type="text" name="empid" lay-verify="required" class="layui-input ns-len-long" autocomplete="off" value="{$info.employeeID}">
		</div>
	</div>
	<div class="layui-form-item">
		<label class="layui-form-label "><span class="required">*</span>员工姓名：</label>
		<div class="layui-input-block">
			<input type="text" name="username" lay-verify="required" class="layui-input ns-len-long" autocomplete="off" value="{$info.username}">
		</div>
	</div>
	<div class="layui-form-item">
		<label class="layui-form-label "><span class="required">*</span>手机号：</label>
		<div class="layui-input-block">
			<input type="text" name="mobile" lay-verify="required" class="layui-input ns-len-long" autocomplete="off" value="{$info.mobile}">
		</div>
	</div>
	<div class="layui-form-item">
		<label class="layui-form-label"><span class="required">*</span>主理人：</label>
		<div class="layui-input-block">
			<input type="checkbox" name="is_manager" value="1" lay-skin="switch" {if $info.is_manager==1}checked{/if} />
		</div>
	</div>
<div class="layui-form-item">
				<label class="layui-form-label">员工头像：</label>
				<div class="layui-input-block">
					<div class="upload-img-block img-upload">
						<div class="upload-img-box">
							<div class="ns-upload-default" id="imgUpload">
								<div class="upload">
									<img src="ADMIN_IMG/upload_img.png"/>
									<p>点击上传</p>
								</div>
							</div>
							<div class="operation">
								<div>
									<i title="图片预览" class="iconfont iconreview js-preview" style="margin-right: 20px;"></i>
									<i title="删除图片" class="layui-icon layui-icon-delete js-delete"></i>
								</div>

								<div class="replace_img js-replace">点击替换</div>
							</div>
							<input type="hidden" name="headimg" value="{$info.headimg}">
						</div>
					</div>
				</div>
				<div class="ns-word-aux">
					<p>建议图片尺寸：100px * 100px。图片格式：jpg、png、jpeg。</p>
				</div>
			</div>
	<div class="ns-form-row">
		<button type="button" class="layui-btn ns-bg-color" lay-submit lay-filter="save">保存</button>
		<button class="layui-btn layui-btn-primary" onclick="back()">返回</button>
	</div>
</div>
{/block}
{block name="script"}
<script>
	layui.use('form', function() {
		var form = layui.form,
			repeat_flag = false; //防重复
		form.render();
// 普通图片上传
		var imgUpload_upload = new Upload({
			elem: '#imgUpload'
		});
		form.on('submit(save)', function(data) {

			if(repeat_flag) return;
			repeat_flag = true;

			$.ajax({
				url: ns.url("admin/shopemployee/edits"),
				data: data.field,
				dataType: 'JSON',
				type: 'POST',
				success: function(res) {
					repeat_flag = false;

					if (res.code == 0) {
						layer.msg(res.message);
						var site_id=$("input[name='site_id']").val();
						window.location.href = ns.url("admin/shopemployee/lists",{site_id:site_id});
					}else{
						layer.msg(res.message);
					}
				}
			});
		});
	});
	
</script>
{/block}
