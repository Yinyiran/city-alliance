{extend name="base"/}
{block name="resources"}
<style>
	.ns-form {margin-top: 0;}
</style>
{/block}
{block name="main"}
<div class=" layui-form ns-form">
	<div class="layui-form-item">
		<label class="layui-form-label"><span class="required">*</span>名称：</label>
		<div class="layui-input-block">
			<input type="text" name="name" lay-verify="required" value="{$category_info.data.name}" class="layui-input ns-len-long" autocomplete="off">
		</div>
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">筛选区间最小值：</label>
		<div class="layui-input-block">
			<input type="number" name="min" value="{$category_info.data.max}" class="layui-input ns-len-short" lay-verify="required" autocomplete="off">
		</div>
		<!--<div class="ns-word-aux">
			<p></p>
		</div>-->
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label">筛选区间最大值：</label>
		<div class="layui-input-block">
			<input type="number" name="max" value="{$category_info.data.max}" class="layui-input ns-len-short" lay-verify="required" autocomplete="off">
		</div>
		<!--<div class="ns-word-aux">
			<p></p>
		</div>-->
	</div>

	<div class="layui-form-item">
		<label class="layui-form-label ">排序：</label>
		<div class="layui-input-block">
			<input type="number" name="sort" class="layui-input ns-len-short" lay-verify="sorts" value="{$category_info.data.sort}" autocomplete="off">
		</div>
		<div class="ns-word-aux">
			<p>排序值必须为整数；数值越小，越靠前</p>
		</div>
	</div>



	<div class="ns-form-row">
		<button type="button" class="layui-btn ns-bg-color" lay-submit lay-filter="save">保存</button>
		<button class="layui-btn layui-btn-primary" onclick="back()">返回</button>
	</div>

	<input type="text" name="id" lay-verify="required" value="{$category_info.data.id}" class="layui-input layui-hide">
</div>
{/block}
{block name="script"}
<script>
	layui.use('form', function() {
		var form = layui.form,
			repeat_flag = false; //防重复
		form.render();

		form.on('submit(save)', function(data) {
			if(repeat_flag) return false;
			repeat_flag = true;

			$.ajax({
				url: ns.url("admin/benefitoption/edit"),
				data: data.field,
				dataType: 'JSON',
				type: 'POST',
				success: function(res) {
					repeat_flag = false;
					
					if (res.code == 0) {
						layer.confirm('编辑成功', {
							title:'操作提示',
							btn: ['返回列表', '继续操作'],
							yes: function(){
								location.href = ns.url("admin/benefitoption/lists")
							},
							btn2: function() {
								location.reload();
							}
						});
					}else{
						layer.msg(res.message);
					}
				}
			});
		});
		
		/**
		 * 表单验证
		 */   
		form.verify({
			sorts: function(value){ 
				if (value == '') {
					return;
				}
				if (value%1 != 0) {
					return '排序数值必须为整数';
				}
				if (value < 0) {
					return '排序数值必须为大于0';
				}
			},

		});   
	});
	
	function back(){
		location.href = ns.url("admin/benefitoption/lists")
	}
</script>
{/block}
