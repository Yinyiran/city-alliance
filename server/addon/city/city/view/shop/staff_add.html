{extend name="base"/}
{block name="resources"}
<style>
    .ns-form {
        margin-top: 0;
    }
</style>
{/block}
{block name="main"}
<div class="layui-form ns-form">
    <div class="layui-form-item">
        <label class="layui-form-label"><span class="required">*</span>姓名：</label>
        <div class="layui-input-inline">
            <input name="name" type="text" lay-verify="required" class="layui-input ns-len-long">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label"><span class="required">*</span>手机号：</label>
        <div class="layui-input-ns">
            <input name="username" type="text" lay-verify="required" class="layui-input ns-len-long"
                   autocomplete="off" >
        </div>
        <!--        <span class="ns-word-aux">请填写手机号</span>-->
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label"><span class="required">*</span>主理人：</label>
        <div class="layui-input-block">
            <input type="checkbox" name="is_manager" value="1" lay-skin="switch" />
        </div>
    </div>


    <div class="layui-form-item">
        <label class="layui-form-label img-upload-lable ns-short-label">头像：</label>
        <div class="layui-input-block">
            <div class="upload-img-block img-upload">
                <div class="upload-img-box">
                    <div class="ns-upload-default" id="imgUpload">
                        <div class="upload">
                            <img src="ADMIN_IMG/upload_img.png" data-id="imgUpload"/>
                            <p>点击上传</p>
                        </div>
                    </div>
                    <div class="operation">
                        <div>
                            <i title="图片预览" class="iconfont iconreview js-preview" style="margin-right: 20px;"></i>
                            <i title="删除图片" class="layui-icon layui-icon-delete js-delete"></i>
                        </div>
                        <div class="replace_img js-replace">点击替换</div>
                    </div>
                    <input type="hidden" name="image_url" value="">
                </div>
            </div>
        </div>
        <div class="ns-word-aux">
            <p>图片格式：jpg、png、jpeg。</p>
        </div>
    </div>








    <div class="layui-form-item" hidden>
        <label class="layui-form-label">排序：</label>
        <div class="layui-input-inline">
            <input type="number" name="sort" class="layui-input ns-len-short" placeholder="0" autocomplete="off">
        </div>
    </div>

    <div class="ns-form-row">
        <button class="layui-btn ns-bg-color" lay-submit lay-filter="save">保存</button>
        <button type="reset" class="layui-btn layui-btn-primary" onclick="back()">返回</button>
    </div>
    <input type="hidden" name="site_id" value="{$site_id}">
</div>
{/block}
{block name="script"}
<script>
    layui.use(['form', 'laydate'], function () {
        var form = layui.form,
            laydate = layui.laydate,
            repeat_flag = false;//防重复标识
        form.render();

        laydate.render({
            elem: '#laydate'
        });

        /**
         * 表单验证
         */
        form.verify({

            num: function (value) {
                if (value == '') {
                    return;
                }
                if (value % 1 != 0) {
                    return '排序数值必须为整数';
                }
                if (value < 0) {
                    return '排序数值必须为大于0';
                }
            }
        });

        // 普通图片上传
        var logo_upload = new Upload({
            elem: '#imgUpload'
        });
        form.on('submit(save)', function (data) {

            if (repeat_flag) return false;
            repeat_flag = true;
            if (!data.field.image_url) logo_upload.delete();
            $.ajax({
                url: '{:addon_url("city://city/shop/staffAdd")}',
                data: data.field,
                dataType: 'json',
                type: 'post',
                success: function (res) {
                    repeat_flag = false;

                    if (res.code == 0) {
                        layer.confirm('添加成功', {
                            title: '操作提示',
                            btn: ['返回列表', '继续添加'],
                            yes: function () {
                                location.href = ns.url("city://city/shop/siteStaff?site_id=" + {$site_id})
                            },
                            btn2: function () {
                                location.href = ns.url("city://city/shop/staffAdd?site_id=" + {$site_id})
                            }
                        })
                    } else {
                        layer.msg(res.message);
                    }
                }
            });
        });
    });

    function back() {
        location.href = ns.url("city://city/shop/siteStaff?site_id=" + {$site_id})
    }
</script>
{/block}
