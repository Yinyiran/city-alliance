{extend name="base"/}
{block name="resources"}
{/block}
{block name="main"}

<!-- 搜索框 -->

<div class="ns-single-filter-box">
    <div style="display: flex; align-items: center;">
        <button class="layui-btn ns-bg-color" onclick="addBrand()">添加商家员工</button>
        {notempty name="$shop_info.site_name"}
        <span style="font-size: 14px; font-weight: bold; margin-left: 15px; color: #333;">【{$shop_info.site_name}】员工列表</span>
        {/notempty}
    </div>
    <div class="layui-form">
        {notempty name="$store_list"}
        <div class="layui-input-inline">
            <select name="search_store_id">
                <option value="">全部门店</option>
                {foreach $store_list as $store}
                <option value="{$store.store_id}">{$store.store_name}</option>
                {/foreach}
            </select>
        </div>
        {/notempty}
        <div class="layui-input-inline">
            <input type="text" name="search_keys" placeholder="请输入姓名" autocomplete="off" class="layui-input">
        </div>
        <div class="layui-input-inline">
            <input type="text" name="search_username" placeholder="请输入手机号" autocomplete="off" class="layui-input">
            <button type="button" class="layui-btn layui-btn-primary" lay-filter="search" lay-submit>
                <i class="layui-icon">&#xe615;</i>
            </button>
        </div>
    </div>
</div>



<table id="brand_list" lay-filter="brand_list"></table>

<script type="text/html" id="image_url">
    {{# if(d.image_url){ }}
    <div class="ns-img-box">
        <img layer-src src={{ns.img(d.image_url)}}>
    </div>
    {{# } }}
</script>

<!-- 操作 -->
<script type="text/html" id="action">
    <div class="ns-table-btn">
        <a class="layui-btn" lay-event="edit">编辑</a>
        <a class="layui-btn" lay-event="delete">删除</a>


    </div>
</script>

<!-- 编辑排序 -->
<script type="text/html" id="editSort">

    <input name="sort" type="number" onchange="editSort({{d.id}}, this)" value="{{d.sort}}"
           class="layui-input edit-sort ns-len-short">
</script>
{/block}
{block name="script"}
<script>
    var form, table;
    layui.use(['table', 'form'], function () {
        form = layui.form;
        form.render();

        table = new Table({
            elem: '#brand_list',
            url: ns.url("city://city/shop/siteStaff?site_id=" + {$new_site_id}),
            cols: [
                [
                    {
                        field: 'site_name',
                        title: '所属店铺',
                        width: '18%',
                        unresize: 'false'
                    },
                    {
                        field: 'store_name',
                        title: '所属门店',
                        width: '18%',
                        unresize: 'false'
                    },
                    {
                        field: 'username',
                        title: '姓名',
                        width: '12%',
                        unresize: 'false'
                    },
                    {
                        field: 'mobile',
                        title: '手机号',
                        width: '14%',
                        unresize: 'false'
                    },
                    {
                        field: 'is_manager',
                        title: '类型',
                        width: '10%',
                        unresize: 'false',
                        templet: function (data) {
                            if (data.is_manager == 1) {
                                return '<span style="color: #ff5722; font-weight: bold;">主理人</span>';
                            } else {
                                return '<span>员工</span>';
                            }
                        }
                    },
                    {
                        field: 'create_time',
                        title: '添加时间',
                        width: '15%',
                        unresize: 'false',
                        templet: function (data) {
                            return data.create_time ? ns.time_to_date(data.create_time) : '-';
                        }
                    },
                    {
                        title: '操作',
                        width: '13%',
                        toolbar: '#action',
                        unresize: 'false'
                    }
                ]
            ]
        });

        /**
         * 监听工具栏操作
         */
        table.tool(function (obj) {
            var data = obj.data;
            switch (obj.event) {
                case 'edit':
                    location.href = ns.url("city://city/shop/staffEdit", {"id": data.employee_id});
                    break;
                case 'delete':
                    deleteBrand(data.employee_id);
                    break;
            }
        });

        /**
         * 删除
         */
        function deleteBrand(brand_id) {
            layer.confirm('确定要删除吗？', function () {
                $.ajax({
                    url: ns.url("city://city/shop/staffDelete"),
                    data: {id: brand_id},
                    dataType: 'JSON',
                    type: 'POST',
                    success: function (res) {
                        layer.msg(res.message);
                        if (res.code == 0) {
                            table.reload({
                                page: {
                                    curr: $(".layui-laypage-em").next().html()  //主要代码行
                                },
                            });
                        }
                    }
                });
            });
        }

        /**
         * 搜索功能
         */
        form.on('submit(search)', function (data) {
            table.reload({
                page: {
                    curr: 1
                },
                where: data.field
            });
        });
    });

    // 监听单元格编辑
    function editSort(id, event) {
        var data = $(event).val();

        if (!new RegExp("^-?[0-9]\\d*$").test(data)) {
            layer.msg("排序号只能是整数");
            return;
        }
        if (data < 0) {
            layer.msg("排序号必须大于0");
            return;
        }
        $.ajax({
            type: 'POST',
            url: ns.url("admin/banner/modifySort"),
            data: {
                sort: data,
                id: id
            },
            dataType: 'JSON',
            success: function (res) {
                layer.msg(res.message);
                if (res.code == 0) {
                    table.reload({
                        page: {
                            curr: $(".layui-laypage-em").next().html()  //主要代码行
                        },
                    });
                }
            }
        });
    }

    function addBrand() {
        location.href = ns.url("city://city/shop/staffAdd?site_id=" + "{$new_site_id}");
    }
</script>
{/block}
