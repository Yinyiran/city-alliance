{extend name="base"/}
{block name="resources"}
<style>
	.ns-screen{margin-bottom: 15px;}
	.contraction span {
		cursor: pointer;
		display: inline-block;
		width: 17px;
		height: 17px;
		text-align: center;
		line-height: 14px;
		user-select: none;
	}
	.store-list {
		overflow: hidden;
		padding: 0 45px;
	}
	.store-list li .img-wrap {
		vertical-align: middle;
		margin-right: 8px;
		width: 120px;
		height: 120px;
		text-align: center;
		line-height: 120px;
	}
	.store-list li .img-wrap img {
		max-width: 100%;
		max-height: 100%;
	}
	.store-list li .info-wrap span.sku-name {
		-webkit-line-clamp: 2;
		margin-bottom: 5px;
	}
	.store-list li .info-wrap span {
		display: -webkit-box;
		margin-bottom: 5px;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: normal;
		word-break: break-all;
		-webkit-box-orient: vertical;
		-webkit-line-clamp: 1;
	}
	.store-list li {
		float: left;
		display: flex;
		padding: 10px;
		margin-right: 10px;
		margin-bottom: 10px;
		border: 1px solid #EFEFEF;
		width: 294px;
		height: 140px;
		align-items: center;
	}
	.img_block_sty{
		width:30% !important;
		height:90px !important;
		line-height: 0px !important;
	}
	.img_block_sty img{
		width:100%;
		height:100%;
	}
	.info_block_sty{
		width:70% !important;
		height:90px !important;
	}
	.change_lines{
		box-sizing: content-box;
	}
	.change_line{
		width:100%;
		height:auto;
		white-space:normal;
		margin-top: 10px;
		font-size:13px;
	}
	.layui-table-cell {
		height: auto;
		overflow: visible;
		text-overflow: inherit;
		white-space: normal;
	}
</style>

{/block}
{block name="main"}
<div class="layui-collapse ns-tips">
	<div class="layui-colla-item">
		<h2 class="layui-colla-title">操作提示</h2>
		<ul class="layui-colla-content layui-show">
			<li>当前页面对商家的员工信息进行管理，可以添加商家员工。</li>
		</ul>
	</div>
</div>

<div class="ns-single-filter-box">
   <button class="layui-btn ns-bg-color" onclick="clickAdd({$site_id})">添加商家员工</button>
</div>

<div class="ns-screen layui-collapse" lay-filter="selection_panel">
	<div class="layui-colla-item">
		<h2 class="layui-colla-title">筛选</h2>
		<form class="layui-colla-content layui-form layui-show">
			<div class="layui-form-item">
				<div class="layui-inline">
					<label class="layui-form-label">员工名称：</label>
					<div class="layui-input-inline">
						<input type="text" id="search_username" name="username" placeholder="请输入员工姓名" class="layui-input">
					</div>
				</div>
				<div class="layui-inline">
					<label class="layui-form-label">手机号：</label>
					<div class="layui-input-inline">
						<input type="text" id="search_mobile" name="mobile" placeholder="请输入员工手机号" class="layui-input">
					</div>
				</div>

			</div>
			
			<div class="ns-form-row">
				<button class="layui-btn ns-bg-color" lay-submit lay-filter="search">筛选</button>
				<button type="reset" class="layui-btn layui-btn-primary">重置</button>
			</div>
		</form>
	</div>
</div>

<table id="employee_lsit" lay-filter="employee_lsit"></table>
<script type="text/html" id="employeeinfo">
	<div></div>
</script>

<!-- 是否主理人 -->
<script type="text/html" id="is_manager">
	{{ d.is_manager == 1 ? '是' : '否' }}
</script>

<!-- 头像 -->
<script type="text/html" id="headimg">
	{{# if(d.haedimg){ }}
	<div class="ns-img-box">
		<img layer-src src={{ns.img(d.haedimg)}} >
	</div>
	{{# } }}
</script>

<!-- 头像 -->
<script type="text/html" id="editdialog">
	
</script>

<!-- 工具栏操作 -->
<script type="text/html" id="action">
	<div class="ns-table-btn">
		<a class="layui-btn" lay-event="edit">编辑</a>
		<a class="layui-btn" lay-event="delete">删除</a>
	</div>
</script>

{/block}

{block name="script"}
<script>
	var laytpl;
	$(function () {
		var site_id="{$site_id}";
		layui.use(['form', 'laydate','laytpl'], function() {
			laytpl = layui.laytpl;
			var table, table_website,
				form = layui.form,
				laydate = layui.laydate;
			form.render();
			/**
			 * 渲染表格
			 */
			var url="";
			table = new Table({
				elem: '#employee_lsit',
				url: ns.url("shop/shopemployee/lists"),
				where: {
					"site_id": site_id
				},
				cols: [
					[{
						field:'employeeID',
						title: '会员ID',
						width: '10%',
						unresize: 'false'
					},{
						field:'username',
						title: '员工姓名',
						width: '10%',
						unresize: 'false'
					}, {
						field: 'mobile',
						title: '员工手机号',
						width: '10%',
						unresize: 'false'
					},{
						field: 'is_own',
						title: '是否是主理人',
						width: '8%',
						unresize: 'false',
						templet: '#is_manager'
					},{
						field:'headimg',
						title:'头像',
						width:'8%',
						templet:'#headimg'
					},{
						field:'action',
						title:'操作',
						width:'8%',
						templet:'#action'
					}]
				]
			});
			/**
			 * 搜索功能
			 */
			form.on('submit(search)', function(data) {
				table.reload({
					page: {
						curr: 1
					},
					where: data.field
				});
				return false;
			});

			/*
			 * 监听工具栏操作
			 */
			table.tool(function(obj) {
				var data = obj.data,
						event = obj.event;
				switch (event) {
					case 'edit': //编辑信息
						window.location.href=ns.url("shop/shopemployee/edits",{"id":data.employee_id});
						break;
					case 'delete': //基本信息
						dels(data.employee_id);
						break;
				}
			});
		});

	});
	function clickAdd(site_id) {
		location.href = ns.url("shop/shopemployee/adds",{"site_id":site_id});
	}
	function dels($id){
		layer.confirm("确定删除吗？",function(){
			$.ajax({
				url: ns.url("shop/shopemployee/dels"),
				data:{"id":$id},
				dataType: 'JSON',
				type: 'POST',
				success: function(res) {
					repeat_flag = false;
					if (res.code == 0) {
						layer.msg(res.message);
						location.reload();
					}else{
						layer.msg(res.message);
					}
				}
			});
		});
	}
</script>
{/block}
