{extend name="base"/}
{block name="resources"}
{/block}
{block name="main"}


<!-- 搜索框 -->
<div class="ns-single-filter-box">
	<button class="layui-btn ns-bg-color" onclick="clickAdd()">添加商会</button>

	<div class="layui-form">
		<div class="layui-input-inline">
			<input type="text" name="search_text" placeholder="请输入商会名称" autocomplete="off" class="layui-input">
			<button type="button" class="layui-btn layui-btn-primary" lay-filter="search" lay-submit>
				<i class="layui-icon">&#xe615;</i>
			</button>
		</div>
	</div>
</div>

<!-- 店铺主营列表 -->
<table id="category_info" lay-filter="category_info"></table>

<script type="text/html" id="category_id">
	{{#  layui.each(res.data, function(index, item){ }}
	<input type="checkbox" name="label_id" value="{{item.category_id}}"  />
	{{#  }); }}
</script>

<!-- 编辑删除操作 -->
<script type="text/html" id="action">
	<div class="ns-table-btn">
		<a class="layui-btn" lay-event="edit">编辑</a>
		<a class="layui-btn" lay-event="delete">删除</a>
	</div>
</script>
{/block}
{block name="script"}
<script>
layui.use(['form'], function() {
	var table,
		form = layui.form,
		repeat_flag = false;//防重复标识
		
	table = new Table({
		elem: '#category_info',
		url: ns.url("admin/shophui/lists"),
		cols: [
			[{
				unresize: 'false',
				field: 'name',
				title: '商会名称',
				width: '40%',
			}, {
				unresize: 'false',
				field: 'sort',
				title: '排序',
				width: '10%',
			}, {
				unresize: 'false',
				title: '操作',
				width: '20%',
				toolbar: '#action'
			}]
		],
	});
	
	/**
	* 监听工具栏操作
	*/
	table.tool(function(obj) {
		var data = obj.data;
		switch (obj.event) {
			case 'edit': //编辑
			location.href = ns.url("admin/shophui/edit?id="+ data.id)
				break;
			case 'delete': //删除
				deleteCategory(data.id);
				break;
		}
	});

	/**
	* 删除
	*/
	function deleteCategory(category_ids) {
		layer.confirm('确定要删除吗？', function() {
			$.ajax({
				url: ns.url("admin/shophui/delete"),
				data: {id: category_ids},
				dataType: 'JSON',
				type: 'POST',
				success: function(res) {
					layer.msg(res.message);
					repeat_flag = false;
					if (res.code == 0) {
						table.reload();
					}
				}
			});
		});
	}

	form.on('submit(search)', function(data){
		table.reload({
			page: {
				curr: 1
			},
			where: data.field
		});
	});
});

function clickAdd(){
	location.href = ns.url('admin/shophui/add');
}
</script>
{/block}
