{extend name="base"/}
{block name="resources"}
<style>
	.global-video-mode-wrap {
		display: inline-flex;
		align-items: center;
		margin-left: 20px;
	}
	.video-mode-switch {
		display: inline-flex;
		align-items: center;
		background: #ebedf0;
		border-radius: 20px;
		padding: 3px;
		border: 1px solid #dcdfe6;
		box-shadow: inset 0 1px 2px rgba(0,0,0,0.06);
		user-select: none;
	}
	.video-mode-switch .switch-btn {
		padding: 5px 16px;
		border-radius: 16px;
		font-size: 13px;
		line-height: 18px;
		color: #666;
		cursor: pointer;
		transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
		display: inline-flex;
		align-items: center;
		font-weight: 500;
	}
	.video-mode-switch .switch-btn i {
		font-size: 14px;
		margin-right: 5px;
	}
	.video-mode-switch .switch-btn:hover:not(.active-normal):not(.active-review) {
		color: #111;
		background: rgba(255,255,255,0.7);
	}
	.video-mode-switch .switch-btn.active-normal {
		background: #009688;
		color: #fff;
		font-weight: bold;
		box-shadow: 0 2px 6px rgba(0, 150, 136, 0.4);
		cursor: default;
	}
	.video-mode-switch .switch-btn.active-review {
		background: #ff5722;
		color: #fff;
		font-weight: bold;
		box-shadow: 0 2px 6px rgba(255, 87, 34, 0.4);
		cursor: default;
	}
</style>
{/block}
{block name="main"}

<!-- 顶部操作与筛选 -->
<div class="ns-single-filter-box">
	<div style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px;">
		<button class="layui-btn ns-bg-color" onclick="addBrand()">添加</button>
		
		<div class="global-video-mode-wrap">
			<span style="font-size: 13px; font-weight: bold; color: #333; margin-right: 10px;">全平台视频展示：</span>
			<div class="video-mode-switch" id="video_mode_switch" title="点击切换全平台展示模式">
				<div class="switch-btn {if $global_sh_status == 0}active-normal{/if}" id="switch_btn_normal" onclick="switchGlobalVideoMode(0)">
					<i class="layui-icon layui-icon-play"></i> 正常展示视频
				</div>
				<div class="switch-btn {if $global_sh_status == 1}active-review{/if}" id="switch_btn_review" onclick="switchGlobalVideoMode(1)">
					<i class="layui-icon layui-icon-auz"></i> 提审模式(隐藏视频)
				</div>
			</div>
			<span id="mode_help_text" class="layui-word-aux" style="margin-left: 12px; font-size: 12px; color: #888;">
				{if $global_sh_status == 0}
				（当前全平台小程序正常播放短视频）
				{else}
				（当前全平台隐藏短视频，仅展示普通商品，用于微信提审）
				{/if}
			</span>
		</div>
	</div>
	<div class="layui-form">
		<div class="layui-input-inline">
			<input type="text" name="search_keys" placeholder="请输入名称" autocomplete="off" class="layui-input">
			<button type="button" class="layui-btn layui-btn-primary" lay-filter="search" lay-submit>
				<i class="layui-icon">&#xe615;</i>
			</button>
		</div>
	</div>
</div>

<table id="brand_list" lay-filter="brand_list"></table>

<script type="text/html" id="image_url">
	{{# if(d.image_url){ }}
	<div class="ns-img-box">
		<img layer-src src={{ns.img(d.image_url)}} >
	</div>
	{{# } }}
</script>

<!-- 操作 -->
<script type="text/html" id="action">
	<div class="ns-table-btn">
		<a class="layui-btn" lay-event="edit">编辑</a>
		<a class="layui-btn" lay-event="delete">删除</a>
		<a class="layui-btn" lay-event="evaluate">评论列表</a>
	</div>
</script>

<!-- 编辑排序 -->
<script type="text/html" id="editSort">

	<input name="sort" type="number" onchange="editSort({{d.id}}, this)" value="{{d.sort}}" class="layui-input edit-sort ns-len-short">
</script>
{/block}
{block name="script"}
<script>
	var form, table;
	layui.use(['table', 'form'], function() {
		form = layui.form;
		form.render();
		
		table = new Table({
			elem: '#brand_list',
			url: ns.url("admin/video/lists"),
			cols: [
				[
					/* {
					width: "3%",
					type: 'checkbox',
					unresize: 'false'
				}, */
				{
					field: 'name',
					title: '名称',
					width: '25%',
					unresize: 'false'
				}, {
					field: 'site_name',
					title: '关联商家',
					width: '15%',
					unresize: 'false',
				}, {
					field: 'goods_name',
					title: '关联商品',
					width: '20%',
					unresize: 'false'
				},
				// 	{
				// 	field: 'type',
				// 	title: '类型',
				// 	width: '10%',
				// 	templet: function (data) {
				// 		if (data.type == 1) {
				// 			return '首页'
				// 		} else {
				// 			return '商城'
				// 		}
				// 	}
				// },
					/*{
					unresize: 'false',
					title: '排序',
					width: '15%',
					templet: '#editSort'
				},*/
					{
					title: '操作',
					width: '15%',
					toolbar: '#action',
					unresize: 'false'
				}]
			]
		});
		
		/**
		 * 监听工具栏操作
		 */
		table.tool(function(obj) {
			var data = obj.data;
			switch (obj.event) {
				case 'edit':
					location.href = ns.url("admin/video/edit",{"id":data.id});
					break;
				case 'delete':
					deleteBrand(data.id);
					break;
				case 'evaluate': //评论列表
					location.href = ns.url("admin/video/evaluateList" + "?id=" + data.id)
					break;
			}
		});
		
		/**
		 * 删除
		 */
		function deleteBrand(brand_id) {
			layer.confirm('确定要删除吗？', function() {
				$.ajax({
					url: ns.url("admin/video/delete"),
					data: {id: brand_id},
					dataType: 'JSON',
					type: 'POST',
					success: function (res) {
						layer.msg(res.message);
						if (res.code == 0) {
							table.reload({
								page: {
									curr: $(".layui-laypage-em").next().html()  //主要代码行
							   },
							});
						}
					}
				});
			});
		}
		/**
		 * 搜索功能
		 */
		form.on('submit(search)', function(data){
			table.reload({
				page: {
					curr: 1
				},
				where: data.field
			});
		});

	});

	var currentGlobalShStatus = {$global_sh_status|default=0};
	var isOperating = false;

	/**
	 * 切换全平台视频展示模式（带弹窗确认）
	 */
	function switchGlobalVideoMode(targetStatus) {
		if (isOperating) return;
		if (targetStatus === currentGlobalShStatus) {
			var modeName = targetStatus === 0 ? '正常展示视频' : '提审模式（仅商品）';
			layer.msg('当前全平台已处于「' + modeName + '」，无需切换', { icon: 0, time: 1500 });
			return;
		}

		if (targetStatus === 1) {
			layer.confirm(
				'<div style="padding: 10px 5px;">' +
				'<p style="font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #ff5722;"><i class="layui-icon layui-icon-notice" style="font-size: 18px; margin-right: 6px;"></i>确认切换为「提审模式」？</p>' +
				'<p style="font-size: 13px; color: #555; line-height: 22px;">切换后，<span style="color: #ff5722; font-weight: bold;">全平台小程序将隐藏短视频模块</span>，界面仅展示普通商品，通常在微信小程序提审时使用。</p>' +
				'</div>',
				{ title: '全平台视频展示模式切换确认', btn: ['确认切换', '取消'], icon: 3 },
				function(index) {
					layer.close(index);
					doModifyGlobalStatus(1);
				}
			);
		} else {
			layer.confirm(
				'<div style="padding: 10px 5px;">' +
				'<p style="font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #009688;"><i class="layui-icon layui-icon-ok-circle" style="font-size: 18px; margin-right: 6px;"></i>确认恢复为「正常展示视频」？</p>' +
				'<p style="font-size: 13px; color: #555; line-height: 22px;">切换后，<span style="color: #009688; font-weight: bold;">全平台小程序将恢复短视频正常播放与展示</span>。</p>' +
				'</div>',
				{ title: '全平台视频展示模式切换确认', btn: ['确认恢复', '取消'], icon: 3 },
				function(index) {
					layer.close(index);
					doModifyGlobalStatus(0);
				}
			);
		}
	}

	function doModifyGlobalStatus(status) {
		isOperating = true;
		var loadIndex = layer.load(2);
		$.ajax({
			url: ns.url("admin/video/modifyGlobalReviewStatus"),
			data: { status: status },
			dataType: 'JSON',
			type: 'POST',
			success: function (res) {
				layer.close(loadIndex);
				isOperating = false;
				if (typeof res === 'string') {
					try { res = JSON.parse(res); } catch (e) {}
				}
				var isSuccess = (res.code === 0 || res.code === '0' || res.code === 'SUCCESS');
				if (!isSuccess && res.message && (res.message.indexOf('已开启') !== -1 || res.message.indexOf('已恢复') !== -1 || res.message.indexOf('成功') !== -1)) {
					isSuccess = true;
				}
				if (isSuccess) {
					currentGlobalShStatus = status;
					updateModeUI(status);
					layer.msg(res.message || '操作成功', { icon: 1, time: 1500 });
				} else {
					layer.msg(res.message || '操作失败', { icon: 2 });
				}
			},
			error: function () {
				layer.close(loadIndex);
				isOperating = false;
				layer.msg('网络请求失败', { icon: 2 });
			}
		});
	}

	function updateModeUI(status) {
		status = parseInt(status, 10);
		if (status === 0) {
			$('#switch_btn_normal').addClass('active-normal');
			$('#switch_btn_review').removeClass('active-review');
			$('#mode_help_text').text('（当前全平台小程序正常播放短视频）');
		} else {
			$('#switch_btn_normal').removeClass('active-normal');
			$('#switch_btn_review').addClass('active-review');
			$('#mode_help_text').text('（当前全平台隐藏短视频，仅展示普通商品，用于微信提审）');
		}
	}
	
	// 监听单元格编辑
	function editSort(id, event){
		var data = $(event).val();
		
		if(!new RegExp("^-?[0-9]\\d*$").test(data)){
			layer.msg("排序号只能是整数");
			return ;
		}
		if(data<0){
			layer.msg("排序号必须大于0");
			return ;
		}
		$.ajax({
			type: 'POST',
			url: ns.url("admin/video/modifySort"),
			data: {
				sort: data,
				id: id
			},
			dataType: 'JSON',
			success: function(res) {
				layer.msg(res.message);
				if(res.code==0){
					table.reload({
						page: {
							curr: $(".layui-laypage-em").next().html()  //主要代码行
						},
					});
				}
			}
		});
	}
	
	function addBrand() {
		location.href = ns.url("admin/video/add");
	}
</script>
{/block}
