{extend name="base"/}
{block name="resources"}
<style>
    .ns-form {margin-top: 0;}
</style>
{/block}
{block name="main"}

<div class="layui-form ns-form" lay-filter="storeform">

    <div class="layui-form-item">
        <label class="layui-form-label"><span class="required">*</span>城市名称：</label>
        <div class="layui-input-inline">
            <input name="name" value="{$info['name']}" type="text" lay-verify="required" class="layui-input ns-len-long">
        </div>
    </div>

    <!--	增加城市类型-->
    <div class="layui-form-item" style="display: none">
        <label class="layui-form-label"><span class="required">*</span>区域类型：</label>
        <div class="layui-input-inline ns-len-mid">
            <select class="member_level" name="type" lay-verify="required" lay-filter="select-type">
<!--                <option value="">请选择</option>-->
                <option value="1" {if $info.type == 1} selected {/if}>省区域</option>
                <option value="2" {if $info.type == 2} selected {/if}>市区域</option>
                <option value="3" {if $info.type == 3} selected {/if}>区（县）区域</option>
            </select>
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label"><span class="required">*</span>城市地址：</label>
        <div class="layui-input-inline ns-len-mid area-select">
            <select name="province_id" lay-filter="province_id" lay-verify="province_id">
                <option value="">请选择省份</option>
                {foreach $province_list as $k => $v}
                <option value="{$v.id}">{$v.name}</option>
                {/foreach}
            </select>
        </div>

        <div class="layui-input-inline ns-len-mid area-select" id="select-type1">
            <select name="city_id" lay-filter="city_id" lay-verify="city_id">
                <option value="">请选择城市</option>
            </select>
        </div>

        <div class="layui-input-inline ns-len-mid area-select" id="select-type2">
            <select name="district_id"  lay-filter="district_id" lay-verify="district_id">
                <option value="">请选择区/县</option>
            </select>
        </div>

    </div>

        <div class="layui-input-block img-upload">

                    </div>

            <p>建议图片高度：150像素；图片格式：jpg、png、jpeg。</p>
        </div>&ndash;&gt;
    </div>-->

    <div class="layui-form-item" style="display: none">
        <label class="layui-form-label"><span class="required">*</span>区域账号：</label>
        <div class="layui-input-ns">
            <input name="username" type="text" lay-verify="" value="{$info['username']}" class="layui-input ns-len-long"
                   autocomplete="off" disabled>
        </div>
        <span class="ns-word-aux">请填写手机号</span>
    </div>

    <div class="layui-form-item" style="display: none">
        <label class="layui-form-label"><span class="required">*</span>区域登录密码：</label>
        <div class="layui-input-inline">
            <input name="password" type="text"  class="layui-input ns-len-long" autocomplete="off">
        </div>
    </div>


    <div class="layui-form-item">
        <label class="layui-form-label">排序：</label>
        <div class="layui-input-block">
            <input type="number" name="sort" lay-verify="required" value="0" class="layui-input ns-len-long">
        </div>
    </div>

    <input type="hidden" name="id" value="{$info['id']}">


    <div class="ns-form-row">
        <button class="layui-btn ns-bg-color" lay-submit lay-filter="save">保存</button>
        <button class="layui-btn layui-btn-primary" onclick="back()">返回</button>
    </div>
</div>

{block name="script"}
<script type="text/javascript" src="SHOP_JS/address.js"></script>

<script>
    layui.use('form', function() {
        var form = layui.form,
            repeat_flag = false;//防重复标识
        form.render();

        var type = '{$info.type}';

        if (type == 1) {
            $("#select-type2").hide();
            $("#select-type1").hide();
        }else if (type == 2) { //市区域
            $("#select-type2").hide();
            $("#select-type1").show();
        } else if (type == 3) {
            $("#select-type1").show();
            $("#select-type2").show();
        }


        //初始化联系地址
        var initdata = {province_id : '{$info.province_id}', city_id : '{$info.city_id}', district_id : '{$info.district_id}'};
        initAddress(initdata, "storeform");
        form.render();

        form.on('submit(save)', function(data) {
            if(!data.field.image) banner_upload.delete();
            if (repeat_flag) return;
            repeat_flag = true;

            $.ajax({
                type: 'POST',
                dataType: 'JSON',
                url: ns.url("admin/region/editRegion"),
                data: data.field,
                success: function(res) {
                    repeat_flag = false;
                    if (res.code == 0) {
                        layer.confirm('编辑成功', {
                            title:'操作提示',
                            btn: ['返回列表', '继续操作'],
                            yes: function(){
                                location.href = ns.url("admin/region/lists")
                            },
                            btn2: function() {
                                location.reload();
                            }
                        })
                    }else{
                        layer.msg(res.message);
                    }
                }
            });


        });

        form.on('select(select-type)', function (data) {
            // console.log(data);
            // console.log('---------------------')
            if (data.value == 1) { //省区域
                $("#select-type2").hide();
                $("#select-type1").hide();
            } else if (data.value == 2) { //市区域
                $("#select-type2").hide();
                $("#select-type1").show();
            } else if (data.value == 3) {
                $("#select-type1").show();
                $("#select-type2").show();
            }
        })

        //表单验证
        form.verify({


        });

        var banner_upload = new Upload({
            elem: '#bannerUpload'
        });
    });

    function back() {
        location.href = ns.url("admin/region/lists");
    }

    function selectedLink() {
        ns.select_link('', '', function (data) {
            for (var o in data) {
                if (data[o] == null) delete data[o];
            }

            $("input[name='banner_url']").val(JSON.stringify(data));
            $(".nav-url-show").text(data.title);
        }, 'admin/diy/link');
    }
</script>
{/block}
