packages:
  - 'packages/*'
  - 'apps/*'

overrides:
  webpack: 5.98.0

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: true
  vue-demi: true

minimumReleaseAgeExclude:
  - bullmq@6.5.1
