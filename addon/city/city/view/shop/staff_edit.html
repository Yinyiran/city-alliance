{extend name="base"/}
{block name="resources"}
<style>
    .ns-form {
        margin-top: 0;
    }
</style>
{/block}
{block name="main"}
<form class="layui-form ns-form">
    <div class="layui-form-item">
        <label class="layui-form-label"><span class="required">*</span>姓名：</label>
        <div class="layui-input-inline">
            <input name="name" type="text" value="{$brand_info['username']}" lay-verify="required"
                   class="layui-input ns-len-long">
        </div>
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label"><span class="required">*</span>手机号：</label>
        <div class="layui-input-ns">
            <input name="username" value="{$brand_info['mobile']}" type="text" lay-verify="required" class="layui-input ns-len-long"
                   autocomplete="off" >
        </div>
        <!--        <span class="ns-word-aux">请填写手机号</span>-->
    </div>

    <div class="layui-form-item">
        <label class="layui-form-label"><span class="required">*</span>主理人：</label>
        <div class="layui-input-block">
            <input type="checkbox" name="is_manager" value="1" lay-skin="switch" {if $brand_info.is_manager==1}checked{/if} />
        </div>
    </div>


    <div class="layui-form-item">
        <label class="layui-form-label">头像：</label>
        <div class="layui-input-block">
            <input type="hidden" name="id" value="{$brand_info['employee_id']}">
            <div class="upload-img-block">
                <div class="upload-img-box {notempty name=" $brand_info[
                'headimg']"}hover{/notempty}">
                <div class="ns-upload-default" id="imgUpload">
                    {if condition="$brand_info['headimg']"}
                    <div id="preview_imgUpload" class="preview_img">
                        <img layer-src src="{:img($brand_info['headimg'])}" class="img_prev"/>
                    </div>
                    {else/}
                    <div class="upload">
                        <img src="ADMIN_IMG/upload_img.png" data-id="imgUpload"/>
                        <p>点击上传</p>
                    </div>

                    {/if}
                </div>
                <div class="operation">
                    <div>
                        <i title="图片预览" class="iconfont iconreview js-preview" style="margin-right: 20px;"></i>
                        <i title="删除图片" class="layui-icon layui-icon-delete js-delete"></i>
                    </div>
                    <div class="replace_img js-replace">点击替换</div>
                </div>
                <input type="hidden" name="image_url" value="{$brand_info['headimg']}">
            </div>
        </div>
    </div>
    <div class="ns-word-aux">
        <p>图片格式：jpg、png、jpeg。</p>
    </div>
    </div>



    <input type="hidden" name="site_id" value="{$site_id}">




    <div class="ns-form-row">
        <button class="layui-btn ns-bg-color" lay-submit lay-filter="save">保存</button>
        <button type="reset" class="layui-btn layui-btn-primary" onclick="back()">返回</button>
    </div>
</form>
{/block}
{block name="script"}
<script>
    layui.use(['form', 'laydate'], function () {
        var form = layui.form,
            file = "{$brand_info['headimg']}",
            laydate = layui.laydate,
            repeat_flag = false;//防重复标识
        form.render();

        laydate.render({
            elem: '#laydate'
        });

        /**
         * 表单验证
         */
        form.verify({
            num: function (value) {
                if (value == '') {
                    return;
                }
                if (value % 1 != 0) {
                    return '排序数值必须为整数';
                }
                if (value < 0) {
                    return '排序数值必须为大于0';
                }
            }
        });

        // 普通图片上传
        var logo_upload = new Upload({
            elem: '#imgUpload'
        });

        form.on('submit(save)', function (data) {

            // data.field.image_url = file;
            if (repeat_flag) return false;
            repeat_flag = true;

            if (!data.field.image_url) logo_upload.delete();

            $.ajax({
                url: '{:addon_url("city://city/shop/staffEdit")}',
                data: data.field,
                dataType: 'json',
                type: 'post',
                success: function (res) {
                    repeat_flag = false;

                    if (res.code == 0) {
                        layer.confirm('编辑成功', {
                            title: '操作提示',
                            btn: ['返回列表', '继续操作'],
                            yes: function () {
                                location.href = ns.url("city://city/shop/siteStaff?site_id=" + {$site_id})
                            },
                            btn2: function () {
                                location.reload();
                            }
                        })
                    } else {
                        layer.msg(res.message);
                    }
                }
            });
            return false;
        });
    });

    function back() {
        location.href = ns.url("city://city/shop/siteStaff?site_id=" + {$site_id})
    }
</script>
{/block}
