{extend name="base"/}
{block name="resources"}
<style>
	.ns-form {margin-top: 0;}
</style>
{/block}
{block name="main"}
<div class=" layui-form ns-form">
	<div class="layui-form-item">
		<label class="layui-form-label "><span class="required">*</span>主营行业名称：</label>
		<div class="layui-input-block">
			<input type="text" name="category_name" lay-verify="required" class="layui-input ns-len-long" autocomplete="off">
		</div>
	</div>

	<div class="layui-form-item" style="display: none">
		<label class="layui-form-label">图标：</label>
		<div class="layui-input-block">
			<div class="upload-img-block img-upload">
				<div class="upload-img-box ">
				<div class="ns-upload-default" id="logo">
					<div class="upload">
						<img src="CITY_IMG/upload_img.png" data-id="logo"/>
						<p>点击上传</p>
					</div>
				</div>
				<div class="operation">
					<div>
						<i title="图片预览" class="iconfont iconreview js-preview" style="margin-right: 20px;"></i>
						<i title="删除图片" class="layui-icon layui-icon-delete js-delete"></i>
					</div>
					<div class="replace_img js-replace">点击替换</div>
				</div>
				<input type="hidden" name="logo" value="">
			</div>
		</div>
	</div>
</div>

	<div class="layui-form-item">
		<label class="layui-form-label">排序：</label>
		<div class="layui-input-block">
			<input type="number" name="sort" value="0" class="layui-input ns-len-short" lay-verify="sorts" autocomplete="off">
		</div>
		<div class="ns-word-aux">
			<p>排序值必须为整数；数值越小，越靠前</p>
		</div>
	</div>

	<div class="layui-form-item" style="display: none">
		<label class="layui-form-label ">保证金金额：</label>
		<div class="layui-input-block">
			<div class="layui-input-inline">
				<input type="number" name="baozheng_money" value="0.00" class="layui-input ns-len-short" lay-verify="flo" autocomplete="off">
			</div>
			<span class="layui-form-mid">元</span>
		</div>
		<div class="ns-word-aux">
			<p>保证金不能小于0，可保留两位小数</p>
		</div>
	</div>

	<div class="ns-form-row">
		<button type="button" class="layui-btn ns-bg-color" lay-submit lay-filter="save">保存</button>
		<button class="layui-btn layui-btn-primary" onclick="back()">返回</button>
	</div>
</div>
{/block}
{block name="script"}
<script>
	layui.use('form', function() {
		var form = layui.form,
			repeat_flag = false; //防重复
		form.render();

		form.on('submit(save)', function(data) {

			if(repeat_flag) return;
			repeat_flag = true;

			$.ajax({
				url: ns.url("city://city/shopcategory/addCategory"),
				data: data.field,
				dataType: 'JSON',
				type: 'POST',
				success: function(res) {
					repeat_flag = false;

					if (res.code == 0) {
						layer.confirm('添加成功', {
							title:'操作提示',
							btn: ['返回列表', '继续添加'],
							yes: function(){
								location.href = ns.url("city://city/shopcategory/lists")
							},
							btn2: function() {
								location.href = ns.url("city://city/shopcategory/addCategory")
							}
						});
					}else{
						layer.msg(res.message);
					}
				}
			});
		});

		/**
		 * 表单验证
		 */   
		form.verify({
			sorts: function(value){ 
			    if (value == '') {
			    	return;
			    }
			    if (value%1 != 0) {
			    	return '排序数值必须为整数';
			    }
				if (value < 0) {
					return '排序数值必须为大于0';
				}
			},
			flo: function (value) {
				if (value == '') {
					return;
				}
				var reg = /^(0|[1-9]\d*)(\s|$|\.\d{1,2}\b)/;
				if (!reg.test(value)) {
					return '保证金不能小于0，可保留两位小数！'
				}
			}
		});

		// 普通图片上传
		var imgUpload_upload = new Upload({
			elem: '#logo'
		});
		
	});
	
	//跳转到店铺列表
	function back() {
		location.href = ns.url("city://city/shopcategory/lists")
	}
</script>
{/block}
